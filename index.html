<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Buenos Aires, 1867 · El rol</title>
<link rel="icon" href="data:,">
<style>
  :root { --papel:#f1e6cd; --tinta:#2a221b; --rojo:#a03220; }
  html,body { margin:0; height:100%; background:#1d1a17; overflow:hidden; color:var(--papel);
    font:15px/1.4 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; user-select:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .panel { position:fixed; z-index:5; background:var(--papel); color:var(--tinta); border:1px solid var(--tinta);
    outline:1px solid #2a221b99; outline-offset:2px; box-shadow:0 5px 24px #0007; padding:9px 14px 10px; }
  #cargando { position:fixed; inset:0; display:grid; place-items:center; font-size:19px; font-style:italic;
    letter-spacing:.08em; background:#1d1a17; z-index:20; transition:opacity .8s; }
  #cargando.fuera { opacity:0; pointer-events:none; }
  #mision { top:22px; left:22px; max-width:340px; }
  #mision b { font-variant:small-caps; letter-spacing:.07em; font-weight:500; font-size:16px; display:block; }
  #mision span { font-style:italic; opacity:.85; font-size:14px; }
  #bolsa { top:22px; right:22px; text-align:right; font-size:14px; }
  #bolsa b { font-weight:500; color:var(--rojo); }
  #aviso { bottom:150px; left:50%; transform:translateX(-50%); display:none; font-size:15px; }
  #aviso kbd { font:inherit; border:1px solid var(--tinta); padding:0 6px; margin-right:6px; background:#fff6e2; }
  #dialogo { bottom:26px; left:50%; transform:translateX(-50%); width:min(680px,calc(100vw - 40px)); display:none; padding:14px 20px 16px; }
  #dialogo h2 { margin:0 0 4px; font-size:19px; font-weight:500; font-variant:small-caps; letter-spacing:.07em; color:var(--rojo); }
  #dialogo p { margin:0; font-size:17px; line-height:1.45; min-height:3em; }
  #dialogo small { display:block; text-align:right; opacity:.6; font-style:italic; margin-top:6px; font-size:12.5px; }
  #tienda { top:50%; left:50%; transform:translate(-50%,-50%); width:min(560px,calc(100vw - 30px)); display:none; padding:14px 20px 14px; }
  #tienda h2 { margin:0 0 2px; font-size:19px; font-weight:500; font-variant:small-caps; letter-spacing:.07em; color:var(--rojo); }
  #tienda table { width:100%; border-collapse:collapse; font-size:15px; margin:8px 0; }
  #tienda th { font-weight:400; font-style:italic; opacity:.7; font-size:12.5px; text-align:right; }
  #tienda th:first-child, #tienda td:first-child { text-align:left; }
  #tienda td { text-align:right; padding:4px 3px; border-top:1px solid #2a221b33; }
  #tienda button { font:inherit; font-size:13px; padding:1px 8px; margin-left:3px; background:#fff6e2; border:1px solid var(--tinta); color:var(--tinta); cursor:pointer; }
  #tienda button:disabled { opacity:.35; cursor:default; }
  #tienda .sube { color:var(--rojo); } #tienda .baja { color:#3d6b32; }
  #tienda small { display:block; opacity:.65; font-style:italic; font-size:12.5px; }
  #ayuda { bottom:22px; left:22px; font-size:12.5px; font-style:italic; opacity:.92; max-width:260px; transition:opacity 1s; }
  #ayuda.ido { opacity:0; pointer-events:none; }
  #mapa { bottom:22px; right:22px; width:290px; height:290px; padding:0; overflow:hidden; border-radius:14px; }
  #mapa-g { top:50%; left:50%; transform:translate(-50%,-50%); display:none; padding:8px; z-index:8; }
  #mapa-g canvas { position:static; width:min(940px,calc(100vw - 50px)); height:auto; }
  #mapa-g small { display:block; text-align:center; opacity:.65; font-style:italic; font-size:12.5px; margin-top:4px; }
  #mapa canvas { position:static; width:100%; height:100%; }
  body.hablando #ayuda, body.hablando #mapa { display:none; }
  @media (width<=640px) { #mision{max-width:calc(100vw - 150px);} #ayuda{display:none;} #mapa{width:150px;height:150px;} }
</style>
</head>
<body>
<div id="cargando">Desplegando el plano…</div>
<div id="mision" class="panel"><b id="m-tit"></b><span id="m-txt"></span></div>
<div id="bolsa" class="panel">Monedas: <b id="monedas">0</b><div id="objetos"></div></div>
<div id="aviso" class="panel"><kbd>E</kbd><span id="aviso-txt"></span></div>
<div id="dialogo" class="panel"><h2 id="d-nombre"></h2><p id="d-texto"></p><small>E o Espacio para seguir</small></div>
<div id="tienda" class="panel"><h2>Pulpería de Don Isidro</h2><small id="t-info"></small><table id="t-tabla"></table><small id="t-msg">Esc o E para salir</small></div>
<div id="ayuda" class="panel">WASD o flechas: caminar · Shift: correr<br>Q / R: girar la vista · rueda: zoom<br>E: hablar · M: mapa grande</div>
<div id="mapa-g" class="panel"><canvas id="mapa-gc" width="960" height="720"></canvas><small>M o Esc para cerrar</small></div>
<div id="mapa" class="panel"><canvas id="mapa-c" width="300" height="300"></canvas></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
